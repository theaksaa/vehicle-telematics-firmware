CONFIG_GPIO=y

# UART
CONFIG_UART_INTERRUPT_DRIVEN=y

# CAN
CONFIG_CAN=y
CONFIG_CAN_MCP2515=y
CONFIG_SPI=y

# GNSS
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y
CONFIG_GNSS_SATELLITES=y

# Logging
CONFIG_LOG=y
#CONFIG_GNSS_DUMP_TO_LOG=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y

# Vehicle shell value formatting
CONFIG_CBPRINTF_FP_SUPPORT=y

# CAN shell
CONFIG_CAN_SHELL=y

# Bench-only simulator: accepts fake GNSS fixes over the shell UART and uses
# active CAN mode so the board can acknowledge USB-to-CAN frames.
# Set to n before connecting this firmware to a vehicle CAN bus.
CONFIG_TELEMATICS_SIMULATION=y
